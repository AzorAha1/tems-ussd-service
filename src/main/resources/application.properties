spring.application.name=Tems

# Explicit gateway contract. CUMULATIVE handles HML sending either "2" or "7447*1*2" on later messages.
ussd.gateway.input-mode=${USSD_INPUT_MODE:CUMULATIVE}
ussd.gateway.response-mode=${USSD_RESPONSE_MODE:LEGACY_ACCEPT}
# Temporary investigation only. Both switches default OFF; probe always requires approved numbers.
ussd.gateway.diagnostics-enabled=${USSD_DIAGNOSTICS_ENABLED:false}
ussd.gateway.alias-test-enabled=${USSD_ALIAS_TEST_ENABLED:false}
ussd.gateway.alias-test-numbers=${USSD_ALIAS_TEST_NUMBERS:}
# No messageType mapping is assumed. Configure ussd.gateway.message-types per provider.

# ---------------------------------------------------
# Server Configuration
# Railway automatically sets the PORT environment variable
# ---------------------------------------------------
server.port=${PORT:8080}

# ---------------------------------------------------
# Database Configuration - Railway PostgreSQL
# ---------------------------------------------------

spring.datasource.url=jdbc:${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD}
# Connection Pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ---------------------------------------------------i
# JPA / Hibernate
# ---------------------------------------------------
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=true
# spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.open-in-view=false

# ---------------------------------------------------
# Redis Configuration (Railway)
# ---------------------------------------------------
spring.data.redis.host=${REDISHOST:localhost}
spring.data.redis.port=${REDISPORT:6379}
spring.data.redis.password=${REDISPASSWORD:}
spring.data.redis.username=${REDISUSER:default}
spring.data.redis.repositories.enabled=false

# ---------------------------------------------------
# Security (disabled for now)
# ---------------------------------------------------
security.ignored=/**
spring.security.enabled=false

# ---------------------------------------------------
# Aggregator Config (HML)
# ---------------------------------------------------
# No default: the key must come from the AGGREGATOR_API_KEY environment variable (Railway).
aggregator.api.key=${AGGREGATOR_API_KEY:}
aggregator.mtn.product.id=${MTN_PRODUCT_ID:234102200008395}
aggregator.airtel.product.id=${AIRTEL_PRODUCT_ID:PD-16618033881000}
# HML's own numeric id for the TEMS product (same id on the MTN and the Airtel/9mobile host).
aggregator.product.id=${AGGREGATOR_PRODUCT_ID:576}
# AggregatorService is not called by the USSD flow. Keep false: MTN already shows its own N12 charge screen,
# so calling Initiate for an MTN user as well could bill them twice.
aggregator.subscription.enabled=${AGGREGATOR_SUBSCRIPTION_ENABLED:false}
# HML puts the product identity (PD-...) in every webhook notification; only these are accepted.
# Product 576 = PD-17625145556900. Comma-separated if there are several.
aggregator.webhook.accepted-identities=${AGGREGATOR_WEBHOOK_ACCEPTED_IDENTITIES:PD-17625145556900}

# ---------------------------------------------------
# Payment gate (unpaid callers do not see the menu)
# ---------------------------------------------------
# OFF (default) | SHADOW (only logs who would be charged) | ALLOWLIST (only ussd.payment.test-numbers) | ON (everyone)
ussd.payment.mode=${USSD_PAYMENT_MODE:OFF}
# National format, comma-separated, e.g. 07012345678,08012345678
ussd.payment.test-numbers=${USSD_PAYMENT_TEST_NUMBERS:}
ussd.payment.exempt-numbers=${USSD_PAYMENT_EXEMPT_NUMBERS:}
# How long one dial waits for HML's notification before asking the user to dial again
ussd.payment.wait-ms=${USSD_PAYMENT_WAIT_MS:6000}
# How long a pending charge blocks a second Initiate for the same number
ussd.payment.pending-minutes=${USSD_PAYMENT_PENDING_MINUTES:5}
# If the payment check itself breaks (database down): true = let the caller in, false = show "temporarily unavailable"
ussd.payment.fail-open=${USSD_PAYMENT_FAIL_OPEN:true}
# Paid session length in minutes (1440 = 24 hours, matching the product's validity_days of 1)
ussd.payment.session-minutes=${USSD_PAYMENT_SESSION_MINUTES:1440}
# The aggregator call itself must ALSO be switched on (aggregator.subscription.enabled above) before anything is charged.
aggregator.mtn.url=${MTN_API_URL:http://91.109.117.92:8001/api/v1}
aggregator.airtelor9mobile.url=${AIRTEL_API_URL:http://78.110.161.243:8001/api/v1}
aggregator.webhook.url=${WEBHOOK_URL:https://localhost:8080/api/v1/tems/webhook/aggregator}

# ---------------------------------------------------
# Logging
# ---------------------------------------------------
logging.level.com.example.tems=INFO
logging.level.root=WARN
logging.level.org.springframework.web=INFO

# ---------------------------------------------------
# SQL Initialization
# ---------------------------------------------------
spring.sql.init.mode=never


sms.service.base-url=${SMS_SERVICE_BASE_URL:https://sms.temsnet.com}
sms.service.secret=${SMS_SERVICE_SECRET}
sms.service.ussd-origin=${USSD_SERVICE_ORIGIN:https://tems-ussd-service-production.up.railway.app}
sms.service.connect-timeout-ms=2000
sms.service.read-timeout-ms=8500
sms.service.max-retries=1

# ---------------------------------------------------
# CBM Connect Partner API (OAuth2 Client Credentials)
# ---------------------------------------------------
cbm.api.base-url=${CBM_API_BASE_URL:https://sandbox.cbmnigeria.org}
cbm.api.token-url=${CBM_API_TOKEN_URL:https://sandbox.cbmnigeria.org/oauth/token}
cbm.api.client-id=${CBM_API_CLIENT_ID:}
cbm.api.client-secret=${CBM_API_CLIENT_SECRET:}
cbm.api.scope=${CBM_API_SCOPE:cbm.member.read}
cbm.api.connect-timeout-ms=2000
cbm.api.read-timeout-ms=8500
